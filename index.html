<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fast PDF Converter</title>
<meta name="description" content="Free online PDF tools: merge, split, compress, rotate, convert PDF to JPG, images to PDF and more. No sign-up. Files never leave your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout concept: a quiet document-desk. Tools are index cards labelled with
   the operation itself (A + B, PDF → JPG), red appears only where something is actionable. */
:root{
  --bg:#f3f4f6;
  --surface:#ffffff;
  --ink:#141821;
  --muted:#586172;
  --line:#d8dce3;
  --accent:#d92d27;
  --accent-ink:#ffffff;
  --accent-soft:#fdecea;
  --ok:#14703f;
  --err:#b42318;
  --err-soft:#fdeceb;
  --display:'Space Grotesk',Inter,system-ui,sans-serif;
  --body:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1218;--surface:#171b23;--ink:#eef0f4;--muted:#9aa4b4;--line:#2b313c;
    --accent:#ff5d55;--accent-ink:#1b0907;--accent-soft:#2b1715;--ok:#4cc38a;--err:#ff8a80;--err-soft:#2d1816;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1218;--surface:#171b23;--ink:#eef0f4;--muted:#9aa4b4;--line:#2b313c;
  --accent:#ff5d55;--accent-ink:#1b0907;--accent-soft:#2b1715;--ok:#4cc38a;--err:#ff8a80;--err-soft:#2d1816;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--body);min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0;font-weight:700;letter-spacing:-.01em}
p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{width:100%;max-width:1080px;margin:0 auto;padding-inline:20px}

/* header */
.top{border-bottom:1px solid var(--line);background:var(--surface)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;padding-block:14px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:700 20px/1 var(--display)}
.mark{width:24px;height:30px;background:var(--accent);clip-path:polygon(0 0,70% 0,100% 28%,100% 100%,0 100%);display:inline-block}
.top nav{display:flex;gap:20px;flex-wrap:wrap}
.top nav a{text-decoration:none;color:var(--muted);font-size:15px;font-weight:500}
.top nav a:hover{color:var(--ink);text-decoration:underline}
main{flex:1;padding-block:40px 64px}

/* home */
.hero{max-width:720px;margin-bottom:40px}
.hero h1{font-size:clamp(32px,5.5vw,52px)}
.hero p{margin-top:14px;color:var(--muted);font-size:18px;max-width:56ch}
.facts{display:flex;flex-wrap:wrap;gap:8px 22px;margin:22px 0 0;padding:0;list-style:none;font:500 13px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em}
.facts li::before{content:"";display:inline-block;width:8px;height:8px;background:var(--accent);margin-right:8px;vertical-align:0}
.group+.group{margin-top:36px}
.group h2{font-size:15px;font-family:var(--mono);font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;align-items:center;gap:14px;margin-bottom:14px}
.group h2::after{content:"";flex:1;height:1px;background:var(--line)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px 18px;text-decoration:none;min-width:0}
.card:hover{border-color:var(--accent)}
.card .tag{font:500 12px/1 var(--mono);color:var(--accent);letter-spacing:.04em}
.card h3{font-size:19px}
.card p{font-size:14px;color:var(--muted)}

/* tool view */
.back{display:inline-block;margin-bottom:18px;color:var(--muted);text-decoration:none;font-weight:500;font-size:15px}
.back:hover{color:var(--ink);text-decoration:underline}
.tool h1{font-size:clamp(28px,4.5vw,40px)}
.tool .lead{margin-top:10px;color:var(--muted);max-width:62ch}
.panel{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:20px;min-width:0}
.drop{border:2px dashed var(--line);border-radius:10px;padding:30px 16px;text-align:center;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center}
.drop strong{font:600 18px/1.3 var(--display)}
.drop span{color:var(--muted);font-size:14px}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.files{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.file{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.file .n{font:500 12px/1 var(--mono);color:var(--muted);min-width:1.6em}
.file .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.file .size{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.icon-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;width:32px;height:32px;cursor:pointer;font:600 15px/1 var(--body)}
.icon-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.icon-btn:disabled{opacity:.35;cursor:default}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-weight:600;font-size:14px}
.field .hint{font-size:13px;color:var(--muted)}
.field input[type=text],.field input[type=number],.field select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
.field.check{flex-direction:row;align-items:center;gap:10px}
.field.check input{width:18px;height:18px;accent-color:var(--accent)}
.btn{font:600 16px/1 var(--body);background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:14px 22px;cursor:pointer;align-self:flex-start}
.btn:hover:not(:disabled){filter:brightness(.93)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent);filter:none}
.btn.small{padding:9px 14px;font-size:14px}
.progress{display:flex;flex-direction:column;gap:6px}
.track{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.fill{height:100%;width:0;background:var(--accent);transition:width .15s}
.progress .msg{font-size:14px;color:var(--muted)}
.notice{border-radius:8px;padding:12px 14px;font-size:15px}
.notice.err{background:var(--err-soft);color:var(--err);border:1px solid var(--err)}
.notice.info{background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.results{display:flex;flex-direction:column;gap:10px}
.results h2{font-size:20px;color:var(--ok)}
.out{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.out .name{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}
.out .size{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.fine{font-size:13px;color:var(--muted)}

/* text pages */
.doc{max-width:720px}
.doc h1{font-size:clamp(30px,5vw,44px);margin-bottom:6px}
.doc .date{color:var(--muted);font-size:14px;margin-bottom:28px}
.doc h2{font-size:22px;margin:30px 0 8px}
.doc p,.doc li{color:var(--ink)}
.doc p+p{margin-top:12px}
.doc ul{padding-left:22px;margin:10px 0 0}
.doc li+li{margin-top:6px}
.doc .note{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:14px 16px;margin:20px 0}

footer{border-top:1px solid var(--line);background:var(--surface);padding-block:24px;font-size:14px;color:var(--muted)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 24px}
footer nav{display:flex;gap:18px;flex-wrap:wrap}
footer a{text-decoration:none}
footer a:hover{text-decoration:underline;color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:520px){.out,.file{flex-wrap:wrap}.file .size{display:none}}
</style>
</head>

<script>
(function () {
  'use strict';

  /* ---- Change these two values for your own site ---- */
  var SITE = { name: 'Fast PDF Converter', email: 'your-email@example.com' };

  var app = document.getElementById('app');
  document.getElementById('year').textContent = new Date().getFullYear();

  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }

  /* ---------- small helpers ---------- */
  function h(tag, props) {
    var e = document.createElement(tag);
    props = props || {};
    Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (k === 'class') e.className = v;
      else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), v);
      else if (v === true) e.setAttribute(k, '');
      else if (v !== false && v != null) e.setAttribute(k, v);
    });
    for (var i = 2; i < arguments.length; i++) {
      var kids = [].concat(arguments[i]);
      kids.forEach(function (c) {
        if (c == null || c === false) return;
        e.append(c.nodeType ? c : document.createTextNode(String(c)));
      });
    }
    return e;
  }
  function fmtSize(b) {
    if (b < 1024) return b + ' B';
    if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
    return (b / 1048576).toFixed(2) + ' MB';
  }
  function esc(s) {
    return s.replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function baseName(f) { return f.name.replace(/\.[^.]+$/, ''); }
  function tick() { return new Promise(function (r) { setTimeout(r, 0); }); }
  function need() {
    var map = { pdflib: window.PDFLib, pdfjs: window.pdfjsLib, jszip: window.JSZip };
    for (var i = 0; i < arguments.length; i++) {
      if (!map[arguments[i]]) {
        throw new Error('A required library did not load. Check your internet connection and reload the page.');
      }
    }
  }
  function download(blob, name) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 15000);
  }
  function toBlob(canvas, type, q) {
    return new Promise(function (res, rej) {
      canvas.toBlob(function (b) {
        b ? res(b) : rej(new Error('Could not create the image. The page may be too large for this device.'));
      }, type, q);
    });
  }

  /* ---------- PDF helpers ---------- */
  async function openPdfLib(file) {
    need('pdflib');
    var buf = await file.arrayBuffer();
    try {
      return await PDFLib.PDFDocument.load(buf);
    } catch (e) {
      if (/encrypt/i.test(e.message || '')) {
        throw new Error('"' + file.name + '" is password protected. Remove the password first, then try again.');
      }
      throw new Error('"' + file.name + '" could not be read. The file may be damaged.');
    }
  }
  async function openPdfJs(file) {
    need('pdfjs');
    var data = new Uint8Array(await file.arrayBuffer());
    try {
      return await pdfjsLib.getDocument({ data: data }).promise;
    } catch (e) {
      if (e && e.name === 'PasswordException') {
        throw new Error('"' + file.name + '" is password protected. Remove the password first, then try again.');
      }
      throw new Error('"' + file.name + '" could not be read. The file may be damaged.');
    }
  }
  async function savePdf(doc) {
    return new Blob([await doc.save()], { type: 'application/pdf' });
  }
  function parseRanges(str, total) {
    var parts = String(str || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    if (!parts.length) throw new Error('Enter page numbers, for example 1-3, 5, 8-');
    var out = [];
    parts.forEach(function (p) {
      var a, b, m;
      if (/^\d+$/.test(p)) { a = b = +p; }
      else if ((m = p.match(/^(\d*)\s*-\s*(\d*)$/)) && (m[1] || m[2])) {
        a = m[1] ? +m[1] : 1;
        b = m[2] ? +m[2] : total;
      } else {
        throw new Error('"' + p + '" is not a valid page range. Use numbers like 1-3, 5, 8-');
      }
      if (a < 1 || b > total || a > b) {
        throw new Error('"' + p + '" does not fit this PDF, which has ' + total + ' page' + (total === 1 ? '' : 's') + '.');
      }
      for (var i = a; i <= b; i++) out.push(i - 1);
    });
    return out;
  }
  async function renderPage(pdf, n, scale) {
    var page = await pdf.getPage(n);
    var base = page.getViewport({ scale: 1 });
    var longest = Math.max(base.width, base.height) * scale;
    var s = longest > 8000 ? scale * 8000 / longest : scale;
    var vp = page.getViewport({ scale: s });
    var c = document.createElement('canvas');
    c.width = Math.ceil(vp.width);
    c.height = Math.ceil(vp.height);
    var ctx = c.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, c.width, c.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    page.cleanup();
    return c;
  }
  async function pageLines(page) {
    var tc = await page.getTextContent();
    var lines = [], cur = '', curY = null;
    function push() {
      if (cur.trim()) lines.push({ text: cur.replace(/\s+/g, ' ').trim(), y: curY });
      cur = ''; curY = null;
    }
    tc.items.forEach(function (it) {
      if (!('str' in it)) return;
      var y = it.transform[5];
      if (curY !== null && Math.abs(y - curY) > 3) push();
      if (curY === null) curY = y;
      cur += it.str;
      if (it.hasEOL) push();
    });
    push();
    return lines;
  }
  function toParagraphs(lines) {
    if (!lines.length) return [];
    var gaps = [];
    for (var i = 1; i < lines.length; i++) {
      var g = lines[i - 1].y - lines[i].y;
      if (g > 0) gaps.push(g);
    }
    gaps.sort(function (a, b) { return a - b; });
    var med = gaps.length ? gaps[Math.floor(gaps.length / 2)] : 0;
    var paras = [], cur = lines[0].text;
    for (var j = 1; j < lines.length; j++) {
      var gap = lines[j - 1].y - lines[j].y;
      if (gap <= 0 || (med && gap > med * 1.5)) { paras.push(cur); cur = lines[j].text; }
      else cur += ' ' + lines[j].text;
    }
    paras.push(cur);
    return paras;
  }
  async function extractAllLines(file, progress) {
    var pdf = await openPdfJs(file);
    var pages = [];
    var chars = 0;
    for (var i = 1; i <= pdf.numPages; i++) {
      await progress((i - 1) / pdf.numPages, 'Reading page ' + i + ' of ' + pdf.numPages);
      var lines = await pageLines(await pdf.getPage(i));
      lines.forEach(function (l) { chars += l.text.length; });
      pages.push(lines);
    }
    if (chars < 10) {
      throw new Error('No text was found. This looks like a scanned PDF (pictures of pages), which needs OCR to read.');
    }
    return pages;
  }
  async function embedImage(doc, file) {
    var buf = await file.arrayBuffer();
    var isJpg = file.type === 'image/jpeg' || /\.jpe?g$/i.test(file.name);
    var isPng = file.type === 'image/png' || /\.png$/i.test(file.name);
    if (isJpg) return doc.embedJpg(buf);
    if (isPng) return doc.embedPng(buf);
    var bmp;
    try { bmp = await createImageBitmap(file); }
    catch (e) { throw new Error('"' + file.name + '" is not an image format this browser can open.'); }
    var c = document.createElement('canvas');
    c.width = bmp.width; c.height = bmp.height;

    drop.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } });
    ['dragenter', 'dragover'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
    ['dragleave', 'drop'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
    drop.addEventListener('drop', function (e) { addFiles(e.dataTransfer.files); });
    input.addEventListener('change', function () { addFiles(input.files); input.value = ''; });

    async function progress(frac, text) {
      fill.style.width = Math.round(frac * 100) + '%';
      progMsg.textContent = text || '';
      await tick();
    }

    function showOutputs(res) {
      resBox.replaceChildren();
      resBox.append(h('h2', {}, 'Done. Your file' + (res.outputs.length > 1 ? 's are' : ' is') + ' ready.'));
      if (res.note) resBox.append(h('div', { class: 'notice info' }, res.note));
      res.outputs.forEach(function (o) {
        resBox.append(h('div', { class: 'out' },
          h('span', { class: 'name' }, o.name),
          h('span', { class: 'size' }, fmtSize(o.blob.size)),
          h('button', { class: 'btn small', type: 'button', onclick: function () { download(o.blob, o.name); } }, 'Download')));
      });
      if (res.outputs.length > 1) {
        resBox.append(h('button', {
          class: 'btn ghost small', type: 'button',
          onclick: async function (e) {
            var b = e.currentTarget; b.disabled = true;
            try {
              need('jszip');
              var z = new JSZip();
              res.outputs.forEach(function (o) { z.file(o.name, o.blob); });
              download(await z.generateAsync({ type: 'blob' }), t.id + '-files.zip');
            } catch (err) { setMsg(err.message, 'err'); }
            b.disabled = false;
          }
        }, 'Download all as ZIP'));
      }
    }

    runBtn.addEventListener('click', async function () {
      runBtn.disabled = true; setMsg(''); resBox.replaceChildren();
      progBox.hidden = false; fill.style.width = '0%'; progMsg.textContent = 'Starting…';
      try {
        var res = await t.run({ files: files.slice(), opts: collect(), progress: progress });
        await progress(1, 'Finished');
        showOutputs(res);
      } catch (e) {
        setMsg(e && e.message ? e.message : 'Something went wrong. Please try again.', 'err');
      } finally {
        progBox.hidden = true;
        runBtn.disabled = files.length < t.min;
      }
    });

    var minNote = t.min > 1 ? ' Add at least ' + t.min + ' files.' : '';
    app.replaceChildren(h('section', { class: 'tool' },
      h('a', { class: 'back', href: '#' }, '← All tools'),
      h('h1', {}, t.name),
      h('p', { class: 'lead' }, t.desc + minNote),
      h('div', { class: 'panel' }, input, drop, list, optBox, runBtn, progBox, msgBox, resBox,
        h('p', { class: 'fine' }, 'Your files are processed on this device and are not uploaded.'))));
    renderFiles();
  }

  function route() {
    var id = decodeURIComponent(location.hash.replace(/^#/, ''));
    var tool = TOOLS.filter(function (t) { return t.id === id; })[0];
    if (tool) showTool(tool);
    else if (id === 'privacy' || id === 'terms' || id === 'contact') showPage(id);
    else showHome();
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
